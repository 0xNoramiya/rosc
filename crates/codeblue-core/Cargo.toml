[package]
name = "codeblue-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Code Blue ($ROSC) rulebook: state machine, scoring and economics. No chain code."

[features]
default = []
# Storage and JSON derives for the contract. The rules never depend on them.
borsh = ["dep:borsh"]
serde = ["dep:serde"]

[dependencies]
borsh = { version = "1", optional = true, features = ["derive"] }
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "config"
required-features = ["serde"]
